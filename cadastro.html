<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cadastre-se como voluntário ou apoiador do Instituto Raiz Viva.">
  <title>Cadastro – Instituto Raiz Viva</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h2>Instituto Raiz Viva</h2>
    <nav>
      <a href="index.html">Início</a>
      <a href="projetos.html">Projetos</a>
      <a href="cadastro.html">Cadastro</a>
    </nav>
  </header>

  <main>
    <h1>Cadastro</h1>
    <img src="imagens/criancahorta.jpg" alt="Voluntários e crianças plantando uma árvore">

    <form action="#" method="post">
      <fieldset>
        <legend>Dados pessoais</legend>

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required minlength="5">

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" required maxlength="14"
               placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
               title="Use o formato 000.000.000-00">

        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required>
      </fieldset>

      <fieldset>
        <legend>Contato</legend>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" required maxlength="15"
               placeholder="(11) 90000-0000" pattern="\(\d{2}\) \d{4,5}-\d{4}"
               title="Use o formato (11) 90000-0000">
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" required maxlength="9"
               placeholder="00000-000" pattern="\d{5}-\d{3}"
               title="Use o formato 00000-000">

        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" name="endereco" required>

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" required>

        <label for="estado">Estado</label>
        <select id="estado" name="estado" required>
          <option value="">Selecione</option>
          <option value="MG">Minas Gerais</option>
          <option value="PR">Paraná</option>
          <option value="RJ">Rio de Janeiro</option>
          <option value="RS">Rio Grande do Sul</option>
          <option value="SP">São Paulo</option>
          <!-- adicione os demais estados -->
        </select>
      </fieldset>

      <button type="submit">Enviar cadastro</button>
    </form>
  </main>

  <footer>
    <p>© 2026 Instituto Raiz Viva</p>
  </footer>
</body>
</html>
